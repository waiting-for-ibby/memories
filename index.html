<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mii Plaza Globe</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(180deg, #89d4f5 0%, #a8e4f9 20%, #c5effc 50%, #d4f4fd 80%, #e8f9ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: grab;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 20% 30%, rgba(255,255,255,0.8) 0%, transparent 30%),
        radial-gradient(circle at 80% 20%, rgba(255,255,255,0.6) 0%, transparent 25%),
        radial-gradient(circle at 60% 80%, rgba(255,255,255,0.4) 0%, transparent 35%);
      pointer-events: none;
    }

    body:active {
      cursor: grabbing;
    }

    #canvas-container {
      width: 500px;
      height: 500px;
      position: relative;
    }

    canvas {
      display: block;
    }

    .glow-ring {
      position: absolute;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.4);
      box-shadow: 
        0 0 20px rgba(255, 255, 255, 0.3),
        inset 0 0 20px rgba(255, 255, 255, 0.1);
      animation: pulse-ring 4s ease-in-out infinite;
      pointer-events: none;
    }

    .glow-ring:nth-child(1) {
      width: 120%;
      height: 120%;
      top: -10%;
      left: -10%;
      animation-delay: 0s;
    }

    .glow-ring:nth-child(2) {
      width: 140%;
      height: 140%;
      top: -20%;
      left: -20%;
      animation-delay: 1s;
    }

    .glow-ring:nth-child(3) {
      width: 160%;
      height: 160%;
      top: -30%;
      left: -30%;
      animation-delay: 2s;
    }

    @keyframes pulse-ring {
      0%, 100% { 
        opacity: 0.5; 
        transform: scale(1);
      }
      50% { 
        opacity: 0.8; 
        transform: scale(1.02);
      }
    }

    .marker {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff 0%, #4ecdc4 50%, #2e8b84 100%);
      border: 2px solid white;
      box-shadow: 
        0 0 10px rgba(78, 205, 196, 0.8),
        0 2px 5px rgba(0,0,0,0.2);
      cursor: pointer;
      transform: translate(-50%, -50%);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      z-index: 10;
    }

    .marker:hover {
      transform: translate(-50%, -50%) scale(1.5);
      box-shadow: 
        0 0 25px rgba(78, 205, 196, 1),
        0 0 40px rgba(255, 255, 255, 0.6),
        0 4px 10px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <script src="hi.js" defer></script>
  <div id="canvas-container">
    <div class="glow-ring"></div>
    <div class="glow-ring"></div>
    <div class="glow-ring"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const container = document.getElementById('canvas-container');
    const width = 500;
    const height = 500;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
    camera.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0x404040, 0.9);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 1.3);
    sunLight.position.set(5, 3, 5);
    scene.add(sunLight);

    const blueLight = new THREE.PointLight(0x00d4ff, 0.5, 10);
    blueLight.position.set(-3, 2, 3);
    scene.add(blueLight);

    const pinkLight = new THREE.PointLight(0xff6b9d, 0.4, 10);
    pinkLight.position.set(3, -2, 3);
    scene.add(pinkLight);

    const globeGroup = new THREE.Group();
    scene.add(globeGroup);

    const sphereGeometry = new THREE.SphereGeometry(1.5, 64, 64);
    
    const canvas = document.createElement('canvas');
    canvas.width = 1024;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');
    
    const gradient = ctx.createLinearGradient(0, 0, 0, 512);
    gradient.addColorStop(0, '#4a9fd4');
    gradient.addColorStop(0.3, '#5bb5e8');
    gradient.addColorStop(0.5, '#4a9fd4');
    gradient.addColorStop(0.7, '#3d8fc4');
    gradient.addColorStop(1, '#2e7ab3');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 1024, 512);

    ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
    for (let i = 0; i < 50; i++) {
      const x = Math.random() * 1024;
      const y = Math.random() * 256;
      const w = Math.random() * 100 + 50;
      const h = Math.random() * 40 + 20;
      ctx.beginPath();
      ctx.ellipse(x, y, w, h, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = '#2d8b3f';
    const continentShapes = [
      { x: 200, y: 150, rx: 60, ry: 40 },
      { x: 450, y: 180, rx: 80, ry: 50 },
      { x: 600, y: 200, rx: 50, ry: 35 },
      { x: 350, y: 320, rx: 70, ry: 45 },
      { x: 700, y: 280, rx: 40, ry: 30 },
      { x: 150, y: 280, rx: 35, ry: 25 },
    ];
    
    continentShapes.forEach(c => {
      ctx.beginPath();
      ctx.ellipse(c.x, c.y, c.rx, c.ry, 0, 0, Math.PI * 2);
      ctx.fill();
    });

    const oceanTexture = new THREE.CanvasTexture(canvas);
    
    const sphereMaterial = new THREE.MeshPhongMaterial({
      map: oceanTexture,
      shininess: 30,
      specular: 0x222222,
    });

    const globe = new THREE.Mesh(sphereGeometry, sphereMaterial);
    globeGroup.add(globe);

    const gridMaterial = new THREE.LineBasicMaterial({ 
      color: 0xffffff, 
      transparent: true, 
      opacity: 0.12 
    });
    
    const latLines = [];
    for (let i = -80; i <= 80; i += 20) {
      const r = 1.502 * Math.cos(Math.abs(i) * Math.PI / 180);
      if (r > 0) {
        const y = 1.502 * Math.sin(i * Math.PI / 180);
        const geometry = new THREE.BufferGeometry();
        const points = [];
        for (let j = 0; j <= 64; j++) {
          const theta = (j / 64) * Math.PI * 2;
          points.push(r * Math.cos(theta), y, r * Math.sin(theta));
        }
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(points, 3));
        const line = new THREE.Line(geometry, gridMaterial);
        latLines.push(line);
        globeGroup.add(line);
      }
    }

    const lonLines = [];
    for (let i = 0; i < 360; i += 30) {
      const geometry = new THREE.BufferGeometry();
      const points = [];
      for (let j = -90; j <= 90; j += 5) {
        const r = 1.502 * Math.cos(Math.abs(j) * Math.PI / 180);
        const y = 1.502 * Math.sin(j * Math.PI / 180);
        const theta = i * Math.PI / 180;
        points.push(r * Math.cos(theta), y, r * Math.sin(theta));
      }
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(points, 3));
      const line = new THREE.Line(geometry, gridMaterial);
      lonLines.push(line);
      globeGroup.add(line);
    }

    const countryMarkers = [
      { lat: 40, lon: -100, name: 'USA' },
      { lat: 51, lon: -0, name: 'UK' },
      { lat: 48, lon: 2, name: 'France' },
      { lat: 52, lon: 10, name: 'Germany' },
      { lat: 35, lon: 139, name: 'Japan' },
      { lat: 31, lon: 121, name: 'China' },
      { lat: -25, lon: 133, name: 'Australia' },
      { lat: -14, lon: -51, name: 'Brazil' },
      { lat: 55, lon: 37, name: 'Russia' },
      { lat: 20, lon: 77, name: 'India' },
      { lat: -33, lon: 151, name: 'Sydney' },
      { lat: 35, lon: -80, name: 'Canada' },
      { lat: 52, lon: -106, name: 'Mexico' },
      { lat: -1, lon: 37, name: 'Kenya' },
      { lat: 30, lon: 31, name: 'Egypt' },
      { lat: -34, lon: -58, name: 'Argentina' },
      { lat: 60, lon: 15, name: 'Sweden' },
      { lat: 46, lon: 8, name: 'Switzerland' },
      { lat: -37, lon: 174, name: 'New Zealand' },
      { lat: 23, lon: 113, name: 'Hong Kong' },
    ];

    const markers = [];

    function latLonToVector3(lat, lon, radius) {
      const phi = (90 - lat) * (Math.PI / 180);
      const theta = (lon + 180) * (Math.PI / 180);
      
      const x = -radius * Math.sin(phi) * Math.cos(theta);
      const y = radius * Math.cos(phi);
      const z = radius * Math.sin(phi) * Math.sin(theta);
      
      return new THREE.Vector3(x, y, z);
    }

    const sphereRadius = 1.5;

    countryMarkers.forEach((country) => {
      const position = latLonToVector3(country.lat, country.lon, sphereRadius);
      
      const markerGeometry = new THREE.SphereGeometry(0.08, 16, 16);
      const markerMaterial = new THREE.MeshBasicMaterial({ 
        color: 0x4ecdc4,
        transparent: true,
        opacity: 0.9
      });
      const marker = new THREE.Mesh(markerGeometry, markerMaterial);
      marker.position.copy(position);
      marker.userData = { country: country };
      markers.push(marker);
      globeGroup.add(marker);
    });

    const markerElements = [];

    countryMarkers.forEach((country, index) => {
      const el = document.createElement('div');
      el.className = 'marker';
      el.title = country.name;
      el.dataset.index = index;
      
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        window.location.href = 'https://www.youtube.com';
      });
      
      container.appendChild(el);
      markerElements.push(el);
    });

    let targetScale = 1;
    let currentScale = 1;
    const defaultScale = 1;
    const zoomedScale = 1.6;

    function updateMarkerPositions() {
      markerElements.forEach((el, index) => {
        const marker = markers[index];
        
        const position = marker.getWorldPosition(new THREE.Vector3());
        position.project(camera);
        
        const x = (position.x * 0.5 + 0.5) * width;
        const y = (-position.y * 0.5 + 0.5) * height;
        
        const cameraDir = new THREE.Vector3();
        camera.getWorldDirection(cameraDir);
        const markerDir = position.clone().normalize();
        const dot = cameraDir.dot(markerDir);
        
        const isVisible = dot > 0.1;
        
        if (isVisible) {
          el.style.display = 'block';
          el.style.left = x + 'px';
          el.style.top = y + 'px';
          
          const distance = camera.position.z;
          const scale = Math.max(0.8, Math.min(1.5, 5 / distance)) * currentScale;
          el.style.transform = `translate(-50%, -50%) scale(${scale})`;
        } else {
          el.style.display = 'none';
        }
      });
    }

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let hoveredIndex = null;

    container.addEventListener('mousemove', (e) => {
      const rect = container.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / height) * 2 + 1;
      
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(markers);
      
      if (intersects.length > 0) {
        const marker = intersects[0].object;
        const index = markers.indexOf(marker);
        
        if (hoveredIndex !== index) {
          if (hoveredIndex !== null) {
            markerElements[hoveredIndex].style.transform = 'translate(-50%, -50%) scale(1)';
          }
          hoveredIndex = index;
          markerElements[index].style.transform = 'translate(-50%, -50%) scale(1.5)';
          
          targetScale = zoomedScale;
          autoRotate = false;
        }
      } else {
        if (hoveredIndex !== null) {
          markerElements[hoveredIndex].style.transform = 'translate(-50%, -50%) scale(1)';
          hoveredIndex = null;
        }
        targetScale = defaultScale;
      }
    });

    container.addEventListener('mouseleave', () => {
      if (hoveredIndex !== null) {
        markerElements[hoveredIndex].style.transform = 'translate(-50%, -50%) scale(1)';
        hoveredIndex = null;
      }
      targetScale = defaultScale;
    });

    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };
    let rotationVelocity = { x: 0, y: 0 };
    let autoRotate = true;

    container.addEventListener('mousedown', (e) => {
      if (e.target.classList.contains('marker')) return;
      isDragging = true;
      autoRotate = false;
      previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      
      const deltaX = e.clientX - previousMousePosition.x;
      const deltaY = e.clientY - previousMousePosition.y;
      
      rotationVelocity.x = deltaY * 0.005;
      rotationVelocity.y = deltaX * 0.005;
      
      globeGroup.rotation.y += rotationVelocity.y;
      globeGroup.rotation.x += rotationVelocity.x;
      
      previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    document.addEventListener('mouseup', () => {
      isDragging = false;
    });

    container.addEventListener('touchstart', (e) => {
      if (e.target.classList.contains('marker')) return;
      isDragging = true;
      autoRotate = false;
      previousMousePosition = { 
        x: e.touches[0].clientX, 
        y: e.touches[0].clientY 
      };
    });

    document.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      
      const deltaX = e.touches[0].clientX - previousMousePosition.x;
      const deltaY = e.touches[0].clientY - previousMousePosition.y;
      
      rotationVelocity.x = deltaY * 0.005;
      rotationVelocity.y = deltaX * 0.005;
      
      globeGroup.rotation.y += rotationVelocity.y;
      globeGroup.rotation.x += rotationVelocity.x;
      
      previousMousePosition = { 
        x: e.touches[0].clientX, 
        y: e.touches[0].clientY 
      };
    });

    document.addEventListener('touchend', () => {
      isDragging = false;
    });

    function animate() {
      requestAnimationFrame(animate);

      currentScale += (targetScale - currentScale) * 0.1;
      globeGroup.scale.setScalar(currentScale);

      if (!isDragging) {
        if (autoRotate) {
          globeGroup.rotation.y += 0.003;
        } else {
          rotationVelocity.x *= 0.98;
          rotationVelocity.y *= 0.98;
          globeGroup.rotation.x += rotationVelocity.x;
          globeGroup.rotation.y += rotationVelocity.y;
          
          if (Math.abs(rotationVelocity.x) < 0.0001 && 
              Math.abs(rotationVelocity.y) < 0.0001) {
            autoRotate = true;
          }
        }
      }

      updateMarkerPositions();

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    });
  </script>
</body>
</html>
